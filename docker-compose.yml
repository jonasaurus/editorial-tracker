# Runs the production build. Set PAYLOAD_SECRET in .env first (see .env.example).
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: file:/app/data/editorial-tracker.db
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env (see .env.example)}
    volumes:
      - data:/app/data

volumes:
  data:
