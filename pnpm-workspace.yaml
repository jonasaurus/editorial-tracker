# Supply-chain safety: install only package versions that are at least
# 28 days old (40320 minutes). See README "Supply-chain safety".
minimumReleaseAge: 40320

# Only these packages can run install scripts.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Patched versions of sub-dependencies (fixes from `pnpm audit`).
# Each version passes the release-age rule.
overrides:
  # Payload pins 7.29.1.
  undici: 7.30.1
  # Via @payloadcms/ui > monaco-editor.
  dompurify: 3.4.17
  # Via drizzle-kit > @esbuild-kit/core-utils (0.18.20). Same version as the rest of the tree.
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  # Optional peer of Vitest for browser-like tests. Not used.
  happy-dom: '-'

# Known advisories with no fix that passes the release-age rule yet.
# Remove each entry when its fix passes the rule, and upgrade.
auditConfig:
  ignoreGhsas:
    # next < 16.4.5: cache leaks with 'use cache' and root params. Not used here.
    # Fix 16.4.5 passes the rule on 2026-12-01.
    - GHSA-mfr8-8qww-v76h
    - GHSA-vc7v-qv4w-wrv8
    # next < 16.4.5, same fix and date. Each one needs a feature that the app does not use:
    # a remote image source for the image optimizer (none is configured),
    - GHSA-7qx7-33qx-rqx2
    # cookies set on Edge runtime routes (the app has no Edge routes),
    - GHSA-f3mh-rxg3-f5g2
    # a route handler that forwards a fetched response (none),
    - GHSA-pc58-hwjq-p385
    # 'use cache' with binary arguments (not used),
    - GHSA-rhh4-g77r-r9qj
    # Cache Components (`cacheComponents` is off).
    - GHSA-vvgp-ww4w-46vf
    # minimatch < 11.0.1: ReDoS in glob patterns. Dev only (ESLint parser).
    # Fix 11.0.1 passes the rule on 2026-11-24.
    - GHSA-g3hv-75wg-m249
